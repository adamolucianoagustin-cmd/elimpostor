<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Juego del Impostor</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASAR CELULAR -->
<div id="pantallaPasar" class="pantalla">
  <div class="card">
    <h2 id="textoPasar"></h2>
    <p>🔒 Asegurate de estar solo</p>
    <button onclick="mostrarCarta()">Estoy listo</button>
  </div>
</div>

<!-- CARTA -->
<div id="pantallaRol" class="pantalla">
  <div class="card">
    <h2 id="turnoJugador"></h2>

    <div id="cartaRol" class="carta">
      <div class="cara frente">Tocá para ver</div>
      <div class="cara dorso" id="textoRol"></div>
    </div>

    <p style="text-align:center;margin-top:12px">
      Tocá de nuevo para pasar el celular
    </p>
  </div>
</div>

<!-- VOTACIÓN -->
<div id="pantallaVotacion" class="pantalla">
  <div class="card scroll">
    <h2>🗳️ Votación</h2>
    <div id="listaVotacion"></div>
  </div>
</div>

<!-- RESULTADO -->
<div id="pantallaResultado" class="pantalla">
  <div class="card scroll">
    <h2>Resultado final</h2>
    <div id="resultadoFinal"></div>
    <button onclick="volverSelector()">🔁 Volver</button>
  </div>
</div>

<!-- SELECTOR -->
<div id="pantallaModo" class="pantalla activa">
  <div class="card">
    <h1>Juego del Impostor</h1>
    <button onclick="irModoLocal()">🧍 Modo Local</button>
    <button onclick="irModoOnline()">🌐 Modo Online</button>
  </div>
</div>

<!-- LOCAL -->
<div id="pantallaLocal" class="pantalla">
  <div class="card scroll">
    <h2>Modo Local</h2>

    <input id="nombreJugador" placeholder="Nombre del jugador">
    <button onclick="agregarJugador()">Agregar</button>

    <p id="contadorJugadores">Jugadores: 0</p>

    <select id="cantidadImpostores">
      <option value="1">1 impostor</option>
      <option value="2">2 impostores</option>
    </select>

    <div id="listaCategoriasInicio"></div>

    <button id="btnIniciar" onclick="iniciarJuego()" disabled>
      Iniciar juego
    </button>

    <ul id="listaJugadores"></ul>
    <button onclick="volverSelector()">⬅ Volver</button>
  </div>
</div>

<div id="pantallaOnline" class="pantalla">
  <div class="card">
    <h2>Modo Online</h2>
    <p>En desarrollo</p>
    <button onclick="volverSelector()">⬅ Volver</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  projectId: "juego-impostor-b58d9"
});
const db = firebase.firestore();
</script>

<script src="script.js"></script>
</body>
</html>
