<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Juego del Impostor</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= MODO ================= -->
<div id="pantallaModo" class="pantalla activa">
  <div class="card">
    <h1>Juego del Impostor</h1>
    <p>Elegí cómo querés jugar</p>

    <button onclick="irModoLocal()">🧍 Modo Local</button>
    <button onclick="irModoOnline()">🌐 Modo Online</button>
  </div>
</div>

<!-- ================= LOCAL ================= -->
<div id="pantallaLocal" class="pantalla">
  <div class="card scroll">

    <h2>Modo Local</h2>

    <input id="nombreJugador" placeholder="Nombre del jugador">
    <button onclick="agregarJugador()">Agregar jugador</button>

    <p id="contadorJugadores">Jugadores: 0</p>

    <h3>Impostores</h3>
    <select id="cantidadImpostores">
      <option value="1">1 impostor</option>
      <option value="2">2 impostores</option>
    </select>

    <h3>Categoría</h3>
    <div id="listaCategoriasInicio" class="categorias"></div>

    <button id="btnIniciar" onclick="iniciarJuego()" disabled>Iniciar juego</button>

    <h3>Jugadores</h3>
    <ul id="listaJugadores"></ul>

    <button onclick="volverSelector()">⬅ Volver</button>
  </div>
</div>

<!-- ================= ONLINE (placeholder) ================= -->
<div id="pantallaOnline" class="pantalla">
  <div class="card scroll">

    <h2>Modo Online</h2>

    <input id="nombreOnline" placeholder="Tu nombre">

    <button onclick="crearSala()">➕ Crear sala</button>

    <hr>

    <input id="codigoSala" placeholder="Código de sala">
    <button onclick="unirseSala()">🔑 Unirse a sala</button>
    <button id="btnIniciarOnline" onclick="iniciarJuegoOnline()" style="display:none">
  🚀 Iniciar juego
</button>

    <p id="codigoActual"></p>

    <h3>Jugadores</h3>
    <ul id="listaJugadoresOnline"></ul>

    <button onclick="volverSelector()">⬅ Volver</button>
  </div>
</div>

<!-- ================= ROL ================= -->
<div id="pantallaRol" class="pantalla">
  <div class="card">
    <div class="carta" id="cartaRol">
      <div class="cara frente" id="frenteCarta"></div>
      <div class="cara dorso" id="dorsoCarta"></div>
    </div>
    <button onclick="confirmarRol()">Listo</button>
  </div>
</div>

<!-- ================= DISCUSIÓN ================= -->
<div id="pantallaDiscusion" class="pantalla">
  <div class="card">
    <h2>Discusión</h2>
    <h1 id="timer">03:00</h1>
    <button onclick="irAVotacion()">Ir a votación</button>
  </div>
</div>

<!-- ================= VOTACIÓN ================= -->
<div id="pantallaVotacion" class="pantalla">
  <div class="card">
    <h2>Votá al impostor</h2>
    <div id="listaVotos"></div>
  </div>
</div>

<!-- ================= FINAL ================= -->
<div id="pantallaFinal" class="pantalla">
  <div class="card">
    <h2 id="resultadoTexto"></h2>
    <p id="detalleFinal"></p>
    <button onclick="salirInicio()">Volver al inicio</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
